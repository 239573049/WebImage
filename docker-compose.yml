# 默认部署方案：ChatGPT2API 主服务 + Sentinel 求解服务（必须）
#
# 快速开始：
#   cp .env.example .env     # 至少填 CHATGPT2API_AUTH_KEY 和 SENTINEL_SOLVER_KEY
#   docker compose up -d --build
#
# 需要图片直链的对象存储（Means）时，见 docs/means-image-storage.md，单独起一个 compose。
#
# 服务说明：
#   app              主服务（对外 3000）
#   sentinel-solver  常驻 Chromium，执行网页 turnstile 挑战（仅内网 8788）
services:
  # ------------------------------------------------------------------
  # Sentinel 求解服务：常驻 Chromium
  # 只接收挑战参数（prepare 响应 + 令牌种子 p），不接收账号 token / Cookie / prompt
  # ------------------------------------------------------------------
  sentinel-solver:
    # 默认拉取 CI 推送的镜像；本地改了 solver 代码时用 --build 重新构建
    image: ${SENTINEL_SOLVER_IMAGE:-ghcr.io/239573049/webimage-sentinel-solver:latest}
    build:
      context: .
      dockerfile: docker/solver.Dockerfile
    container_name: chatgpt2api-solver
    restart: unless-stopped
    environment:
      # 全部通过环境变量配置，镜像内无需命令行参数
      SENTINEL_SOLVER_KEY: ${SENTINEL_SOLVER_KEY:?请在 .env 里设置 SENTINEL_SOLVER_KEY}
      SENTINEL_SOLVER_HOST: 0.0.0.0
      SENTINEL_SOLVER_PORT: "8788"
      SENTINEL_SOLVER_CHROME: /usr/bin/chromium
      SENTINEL_SOLVER_PROFILE_DIR: /tmp/solver-profile
      # 浏览器自身出网：留空直连；需要时填 http://host:port
      SENTINEL_SOLVER_PROXY: ${SENTINEL_SOLVER_PROXY:-}
    expose:
      - "8788"
    # 只在本机调试时打开（默认不暴露到宿主机）
    # ports:
    #   - "127.0.0.1:8788:8788"

  # ------------------------------------------------------------------
  # 主服务
  # ------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/239573049/webimage:latest
    container_name: chatgpt2api
    restart: unless-stopped
    depends_on:
      sentinel-solver:
        condition: service_started
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      # 认证密钥
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:?请在 .env 里设置 CHATGPT2API_AUTH_KEY}

      # 存储后端（json / sqlite / postgres / git）
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      # DATABASE_URL: postgresql://user:password@host:5432/dbname
      # Git 存储后端（STORAGE_BACKEND=git 时使用）：GIT_REPO_URL / GIT_TOKEN / GIT_BRANCH / GIT_FILE_PATH

      # Sentinel 求解服务（容器内用服务名访问）
      # 仅当 config.json 里还没有 sentinel_solver 时由环境变量写入一次，之后以 config.json 为准
      CHATGPT2API_SENTINEL_SOLVER_ENABLED: "true"
      CHATGPT2API_SENTINEL_SOLVER_URL: http://sentinel-solver:8788
      CHATGPT2API_SENTINEL_SOLVER_KEY: ${SENTINEL_SOLVER_KEY:?请在 .env 里设置 SENTINEL_SOLVER_KEY}
      CHATGPT2API_SENTINEL_SOLVER_TIMEOUT_SECONDS: "180"

      # 上游出口代理（可选）；填宿主机上的 HTTP 代理地址，例如 http://host.docker.internal:8118
      CHATGPT2API_PROXY_RUNTIME_ENABLED: ${CHATGPT2API_PROXY_RUNTIME_ENABLED:-false}
      CHATGPT2API_PROXY_RUNTIME_EGRESS_MODE: ${CHATGPT2API_PROXY_RUNTIME_EGRESS_MODE:-single_proxy}
      CHATGPT2API_PROXY_RUNTIME_PROXY_URL: ${CHATGPT2API_PROXY_RUNTIME_PROXY_URL:-}
      CHATGPT2API_PROXY_RUNTIME_SKIP_SSL_VERIFY: ${CHATGPT2API_PROXY_RUNTIME_SKIP_SSL_VERIFY:-false}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:80/',timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
